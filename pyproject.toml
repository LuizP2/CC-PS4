[project]
name = "ps4-mcp"
version = "0.1.0"
description = "Servidor MCP que dá ao Claude Code acesso ao PS4 (ps4debug, FTP, logs) para investigar bugs de ports."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "capstone>=5.0",
]

[project.scripts]
ps4-mcp = "ps4_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyftpdlib>=2.0",
    "ps4debug==1.0.0; python_version >= '3.13'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ps4_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
